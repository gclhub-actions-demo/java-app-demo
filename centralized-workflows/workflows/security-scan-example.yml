name: Standalone CodeQL Security Scan Example

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    if: github.repository != github.repository_owner  # Skip for .github repo itself
    
    strategy:
      fail-fast: false
      matrix:
        language: ['java', 'javascript', 'python']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Detect language in repository
        id: detect-language
        run: |
          LANG="${{ matrix.language }}"
          case "$LANG" in
            java)
              if [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
                echo "detected=true" >> $GITHUB_OUTPUT
              else
                echo "detected=false" >> $GITHUB_OUTPUT
              fi
              ;;
            javascript)
              if [ -f "package.json" ]; then
                echo "detected=true" >> $GITHUB_OUTPUT
              else
                echo "detected=false" >> $GITHUB_OUTPUT
              fi
              ;;
            python)
              if [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
                echo "detected=true" >> $GITHUB_OUTPUT
              else
                echo "detected=false" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "detected=false" >> $GITHUB_OUTPUT
              ;;
          esac
      
      - name: Initialize CodeQL
        if: steps.detect-language.outputs.detected == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      
      - name: Autobuild
        if: steps.detect-language.outputs.detected == 'true'
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        if: steps.detect-language.outputs.detected == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scanning:
    name: Secret Scanning Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  sbom-generation:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.json
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
      
      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@v3
        with:
          sbom: sbom.json
          fail-build: false
          severity-cutoff: high

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [codeql-analysis, secret-scanning, sbom-generation]
    if: always()
    
    steps:
      - name: Check scan results
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM Generation: ${{ needs.sbom-generation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.codeql-analysis.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scanning.result }}" == "failure" ]]; then
            echo "❌ Security scans failed. Please review the results above." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All required security scans passed." >> $GITHUB_STEP_SUMMARY
          fi
