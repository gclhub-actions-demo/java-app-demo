# CodeQL configuration file
# https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning

name: "CodeQL Security Analysis"

# Disable default setup - using custom configuration
disable-default-queries: false

# Query suite selection
queries:
  - uses: security-extended
  - uses: security-and-quality

# Paths to include in analysis
paths:
  - src/main/java
  - src/main/resources

# Paths to ignore
paths-ignore:
  - src/test/**
  - '**/test/**'
  - '**/*.test.java'
  - '**/generated/**'
  - 'target/**'

# Query filters
query-filters:
  - exclude:
      id: java/hardcoded-credential-api-call
      precision: low
  - exclude:
      tags:
        - experimental

# Configure specific query packs
packs:
  - codeql/java-queries:AlertSuppression.ql
  - codeql/java-queries:Security/CWE
