name: Scheduled Security Scan

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  issues: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['java']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Build application
        run: mvn clean package -DskipTests
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Run OWASP Dependency Check
        run: |
          mkdir -p reports
          mvn org.owasp:dependency-check-maven:check \
            -DskipTests \
            -Dformats=HTML,JSON,XML \
            -DfailBuildOnCVSS=0 \
            -DoutputDirectory=reports
      
      - name: Upload dependency check results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: reports
          retention-days: 30
      
      - name: Check for vulnerabilities
        run: |
          if [ -f reports/dependency-check-report.json ]; then
            CRITICAL=$(jq '.dependencies[].vulnerabilities[] | select(.severity=="CRITICAL")' reports/dependency-check-report.json | wc -l)
            HIGH=$(jq '.dependencies[].vulnerabilities[] | select(.severity=="HIGH")' reports/dependency-check-report.json | wc -l)
            
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "Found $CRITICAL critical and $HIGH high severity vulnerabilities"
              exit 1
            fi
          fi

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Generate dependency tree
        run: mvn dependency:tree -DoutputFile=dependency-tree.txt
      
      - name: Check licenses
        run: mvn license:add-third-party
        continue-on-error: true
      
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: target/generated-sources/license/THIRD-PARTY.txt
          retention-days: 30

  create-security-issue:
    name: Create Security Issue if Vulnerabilities Found
    runs-on: ubuntu-latest
    needs: [codeql-analysis, dependency-scan]
    if: failure()
    permissions:
      issues: write
    
    steps:
      - name: Create issue for security findings
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected in scheduled scan',
              body: `## Security Scan Alert
              
              The scheduled security scan on ${new Date().toISOString()} detected vulnerabilities.
              
              ### Actions Required
              - Review the CodeQL analysis results
              - Check the dependency scan report
              - Update vulnerable dependencies
              - Apply security patches
              
              ### Workflow Run
              ${context.payload.repository.html_url}/actions/runs/${context.runId}
              
              **Priority:** High
              **Assigned to:** Security team
              `,
              labels: ['security', 'automated']
            });
            console.log(`Created issue #${issue.data.number}`);
