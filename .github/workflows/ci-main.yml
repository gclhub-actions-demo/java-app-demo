name: CI Main Branch

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Build and run tests
        run: mvn clean verify
      
      - name: Generate coverage report
        run: mvn jacoco:report
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 30
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-main
          path: target/site/jacoco/
          retention-days: 30

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: ./.github/actions/composite-build-action
        with:
          java-version: '17'
          build-tool: 'maven'
          cache-key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      
      - name: Build and export Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: java-app-demo:${{ github.sha }}
          outputs: type=docker,dest=/tmp/java-app-demo.tar
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/java-app-demo.tar
          retention-days: 7

  create-release-draft:
    name: Create Release Draft
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: artifacts
      
      - name: Create release draft
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Changes in this Release
            
            - Automated build from commit ${{ github.sha }}
            - Built on: ${{ github.event.head_commit.timestamp }}
            
            ## Artifacts
            - Application JAR file
            - Docker image available
          files: artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
